name: Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (use latest to update the deployment image)'
        required: true
        default: manual
        type: string
      push:
        description: Push image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

# Serialize with the existing release workflow when updating shared tags.
concurrency:
  group: sub4api-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          {
            echo "image=$image"
            echo "tag=$IMAGE_TAG"
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,mode=max,scope=docker-image

      - name: Write summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          PUSH_IMAGE: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Docker image'
            echo
            echo "Image: \`$IMAGE:$IMAGE_TAG\`"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo "Published: $PUSH_IMAGE"
            if [ "$PUSH_IMAGE" = true ]; then
              echo "Digest: \`$DIGEST\`"
              echo
              echo '```sh'
              echo "docker pull $IMAGE:$IMAGE_TAG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
